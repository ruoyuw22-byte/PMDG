[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagl-mil"
version = "1.0.0"
description = "Reproducible DAGL-MIL implementation for breast-level VinDr-Mammo classification and weak localization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pandas>=2.0",
  "Pillow>=10",
  "pydicom>=3.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "Send2Trash>=1.8",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
dagl-mil = "dagl_mil.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
